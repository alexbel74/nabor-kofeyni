<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Моя кофейня</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F6EFE4;color:#2B1D14;font:18px/1.5 Georgia,serif;padding:24px;box-sizing:border-box}
  .menu{background:#fff;max-width:420px;width:100%;border-radius:22px;padding:34px 30px;box-shadow:0 18px 40px -20px rgba(43,29,20,.4)}
  h1{margin:0 0 4px;font-size:32px}
  .sub{margin:0 0 24px;color:#8A6F5A;font-style:italic}
  ul{list-style:none;padding:0;margin:0}
  li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed #E2D3C0}
  li:last-child{border:0}
  .price{font-weight:700;white-space:nowrap}
</style>
</head>
<body>
  <div class="menu">
    <!-- Впишите название своей кофейни -->
    <h1>☕ Кофейня «Название»</h1>
    <p class="sub">Варим с любовью и с git</p>
    <ul>
      <!-- Каждый напиток — одна строчка li -->
      <li><span>Эспрессо</span><span class="price">150 ₽</span></li>
    </ul>
  </div>
</body>
</html>
